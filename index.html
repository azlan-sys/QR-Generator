<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipment 0721 - Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-soft: #e0f2fe;
      --good: #16a34a;
      --good-soft: #dcfce7;
      --dark: #0f172a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- HOME ---------- */
    #home { max-width: 900px; margin: 0 auto; padding: 14px 14px 60px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 4px 14px; }
    .brand .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #0f172a);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 20px; flex-shrink: 0;
    }
    .brand h1 { font-size: 19px; line-height: 1.2; }
    .brand .tag { font-size: 12px; color: var(--muted); }

    .case-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .case-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 1px 2px rgba(15,23,42,.05);
    }
    .case-card:active { transform: scale(.98); }
    .case-card:hover { border-color: var(--accent); }
    .case-num {
      width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
      background: var(--accent-soft); color: var(--accent);
      font-weight: 800; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .case-info { min-width: 0; flex: 1; }
    .case-code {
      font-family: 'Courier New', monospace;
      font-size: 13.5px; font-weight: 700; letter-spacing: -.2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .case-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .case-meta b { color: var(--good); }

    .home-foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
    .home-foot b { color: var(--accent); }

    /* ---------- SCAN DETAIL ---------- */
    #scan {
      display: none;
      position: fixed; inset: 0;
      background: var(--dark);
      color: #f1f5f9;
      z-index: 20;
    }
    .scan-inner {
      max-width: 520px; margin: 0 auto; padding: 12px;
      height: 100%; display: flex; flex-direction: column;
    }

    .scan-top { display: flex; align-items: center; gap: 10px; padding: 6px 2px 0; }
    .iconbtn {
      background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      border-radius: 10px; padding: 9px 14px; cursor: pointer;
      font-size: 14px; font-weight: 600; flex-shrink: 0;
    }
    .iconbtn:hover { background: #334155; }
    .scan-title { text-align: center; font-size: 15px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* progress bar */
    .prog-track { background: #1e293b; border-radius: 20px; height: 10px; margin-top: 12px; overflow: hidden; }
    .prog-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 20px; transition: width .25s ease;
    }

    .stage-num { font-size: 13px; color: #94a3b8; text-align: center; margin-top: 8px; letter-spacing: .5px; }
    .stage-num b { color: #f1f5f9; }
    .stage-num .pill {
      display: inline-block; padding: 3px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      margin-right: 8px;
    }
    .pill.case { background: #0ea5e9; color: #082f49; }
    .pill.part { background: #4ade80; color: #052e16; }

    .qr-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px 0; min-height: 0; }
    .qr-card {
      background: #fff; border-radius: 16px; padding: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.45);
    }
    .qr-card canvas, .qr-card img { display: block; border-radius: 6px; }

    .qr-label { text-align: center; }
    .qr-label .stage-hint { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .qr-label .codetext {
      font-family: 'Courier New', monospace; font-weight: 700;
      font-size: 17px; letter-spacing: -.3px; color: #fff;
      background: #1e293b; border-radius: 10px; padding: 8px 14px;
      display: inline-block; max-width: 100%; word-break: break-all;
    }

    /* nav */
    .nav-row { display: flex; gap: 10px; padding: 10px 0 6px; }
    .btn {
      border: none; border-radius: 14px; cursor: pointer;
      font-size: 16px; font-weight: 700; padding: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .1s, filter .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-prev { background: #1e293b; color: #e2e8f0; flex: 0 0 90px; border: 1px solid #334155; }
    .btn-next {
      background: linear-gradient(135deg, #0ea5e9, #0284c7); color: #fff; flex: 1;
      font-size: 18px;
    }
    .btn-done { background: var(--good); color: #fff; flex: 1; font-size: 18px; }

    /* finder dots */
    .finder-title { text-align: center; font-size: 11px; color: #64748b; letter-spacing: 1.5px; text-transform: uppercase; padding-top: 4px; }
    .finder {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 10px;
      -webkit-overflow-scrolling: touch;
    }
    .dot {
      flex: 0 0 auto; border-radius: 9px; padding: 5px 0;
      width: 40px; text-align: center; cursor: pointer;
      background: #1e293b; border: 2px solid #334155;
      font-size: 11px; font-weight: 700; color: #64748b;
    }
    .dot span { display: block; font-size: 14px; letter-spacing: -1px; }
    .dot.active { background: #0ea5e9; border-color: #38bdf8; color: #082f49; }
    .dot.done { background: #14532d; border-color: #16a34a; color: #4ade80; }
    .dot .dot-sub { font-size: 8.5px; color: inherit; opacity: .85; letter-spacing: 0; font-family: 'Courier New', monospace; overflow: hidden; }
    .dot.active .dot-sub, .dot.done .dot-sub { color: inherit; }

    @media (max-width: 420px) {
      .qr-card { padding: 10px; }
      .codetext { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- HOME -->
  <div id="home">
    <div class="brand">
      <div class="logo">Q</div>
      <div>
        <h1>Shipment QR Scanner</h1>
        <div class="tag">GMMYN26153N-0721 &middot; Shipment 134</div>
      </div>
    </div>
    <div class="case-list" id="caseList"></div>
    <div class="home-foot">Tap a case &rarr; scan <b>case</b> first, then <b>each part</b></div>
  </div>

  <!-- SCAN -->
  <div id="scan">
    <div class="scan-inner">
      <div class="scan-top">
        <button class="iconbtn" id="backBtn">&#8592; Cases</button>
        <div class="scan-title" id="scanTitle">Case 1</div>
      </div>
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="stage-num" id="stageNum"></div>

      <div class="qr-wrap">
        <div class="qr-card"><div id="qrBox"></div></div>
      </div>

      <div class="qr-label">
        <div class="stage-hint" id="stageHint"></div>
        <div class="codetext" id="qrText"></div>
      </div>

      <div class="nav-row">
        <button class="btn btn-prev" id="prevBtn">&#8592; Prev</button>
        <button class="btn btn-next" id="nextBtn">Next &rarr;</button>
      </div>

      <div class="finder-title">Scan order &mdash; tap to jump</div>
      <div class="finder" id="finder"></div>
    </div>
  </div>

  <script>
    var CASES = [
      { code: 'GMMYN26153N-0721-147F-H001_1', parts: ['1013004105','1013004105','1018059449','1067001068','1067003260'] },
      { code: 'GMMYN26153N-0721-147F-H001_2', parts: ['6600016395','6600016395','6600060213'] },
      { code: 'GMMYN26153N-0721-147F-H002_1', parts: ['6600184215','6600199344','6606737057','6608216635','6608216635','8893199122'] },
      { code: 'GMMYN26153N-0721-147F-H002_2', parts: ['8890065145','8890065211','6608072379'] },
      { code: 'GMMYN26153N-0721-147G-H003_1', parts: ['8894068641','8894068641','8894117399','1013004105','1018059449'] },
      { code: 'GMMYN26153N-0721-147G-H003_2', parts: ['JQ140DA0616FO','JQ1840616'] },
      { code: 'GMMYN26153N-0721-147G-H004_1', parts: ['8893199122','6600199344','6600060213','1067003260','1067001068'] }
    ];

    var curCase = -1, curStep = 0, qr = null;
    var QR_SIZE = 280;

    function itemsFor(i) {
      var items = [{ type: 'case', text: CASES[i].code }];
      CASES[i].parts.forEach(function (p) { items.push({ type: 'part', text: p }); });
      return items;
    }

    function buildHome() {
      var list = document.getElementById('caseList');
      list.innerHTML = '';
      CASES.forEach(function (c, i) {
        var card = document.createElement('div');
        card.className = 'case-card';
        card.innerHTML =
          '<div class="case-num">' + (i + 1) + '</div>' +
          '<div class="case-info">' +
            '<div class="case-code" title="' + c.code + '">' + c.code + '</div>' +
            '<div class="case-meta"><b>' + c.parts.length + '</b> parts &middot; ' + (c.parts.length + 1) + ' scans</div>' +
          '</div>';
        card.addEventListener('click', function () { openCase(i); });
        list.appendChild(card);
      });
    }

    function openCase(i) {
      curCase = i; curStep = 0;
      document.getElementById('home').style.display = 'none';
      document.getElementById('scan').style.display = 'block';
      document.getElementById('scanTitle').textContent = 'Case ' + (i + 1);
      renderStep();
    }

    function goHome() {
      document.getElementById('scan').style.display = 'none';
      document.getElementById('home').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function renderStep() {
      var items = itemsFor(curCase);
      var total = items.length;
      var item = items[curStep];
      var isCase = item.type === 'case';

      var fill = document.getElementById('progFill');
      fill.style.width = ((curStep / (total - 1)) * 100) + '%';

      document.getElementById('stageNum').innerHTML =
        '<span class="pill ' + (isCase ? 'case' : 'part') + '">' + (isCase ? 'Case' : 'Part ' + curStep) + '</span>' +
        'Step <b>' + (curStep + 1) + '</b> of ' + total;

      document.getElementById('stageHint').textContent =
        isCase ? 'Scan the master case first' : 'Scan this part';

      document.getElementById('qrText').textContent = item.text;
      document.getElementById('qrText').title = item.text;

      var box = document.getElementById('qrBox');
      box.innerHTML = '';
      qr = new QRCode(box, { text: item.text, width: QR_SIZE, height: QR_SIZE, correctLevel: QRCode.CorrectLevel.H });

      document.getElementById('prevBtn').disabled = curStep === 0;

      var next = document.getElementById('nextBtn');
      if (curStep === total - 1) {
        next.className = 'btn btn-done';
        next.innerHTML = 'All Scanned &#10003;';
        next.onclick = goHome;
      } else {
        next.className = 'btn btn-next';
        next.innerHTML = 'Next &rarr;';
        next.onclick = function () { curStep++; renderStep(); };
      }

      document.getElementById('prevBtn').onclick = function () {
        if (curStep > 0) { curStep--; renderStep(); }
      };

      renderFinder(items, total);
      var dots = document.querySelectorAll('.finder .dot');
      if (dots[curStep]) dots[curStep].scrollIntoView({ inline: 'center', block: 'nearest' });
    }

    function renderFinder(items, total) {
      var f = document.getElementById('finder');
      f.innerHTML = '';
      items.forEach(function (item, i) {
        var d = document.createElement('div');
        d.className = 'dot';
        if (i === curStep) d.className += ' active';
        else if (i < curStep) d.className += ' done';
        var label = item.type === 'case' ? 'CASE' : 'P' + i;
        d.innerHTML = '<span>' + label + '</span><div class="dot-sub">' + (item.type === 'case' ? 'M' : item.text.replace(/\D/g, '').slice(-3)) + '</div>';
        d.title = item.text;
        d.addEventListener('click', function () { curStep = i; renderStep(); });
        f.appendChild(d);
      });
    }

    document.getElementById('backBtn').addEventListener('click', goHome);

    buildHome();
    if (window.location.hash) {
      var h = parseInt(window.location.hash.replace(/^#case/, ''), 10);
      if (h >= 1 && h <= CASES.length) openCase(h - 1);
    }
  </script>
</body>
</html>
