<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipment 0721 - Scanner</title>
  <style>
    :root {
      --bg: #f8fafc; --panel: #ffffff; --line: #e2e8f0;
      --text: #0f172a; --muted: #64748b; --accent: #0284c7;
      --accent-soft: #e0f2fe; --good: #16a34a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }

    #home { max-width: 900px; margin: 0 auto; padding: 14px 14px 50px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 6px 4px 14px; }
    .brand .logo { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #0284c7, #0f172a); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 20px; flex-shrink: 0; }
    .brand h1 { font-size: 19px; line-height: 1.2; }
    .brand .tag { font-size: 12px; color: var(--muted); }

    .case-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    .case-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .1s; display: flex; align-items: center; gap: 14px; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .case-card:active { transform: scale(.98); }
    .case-card:hover { border-color: var(--accent); }
    .case-num { width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .case-info { min-width: 0; flex: 1; }
    .case-code { font-family: 'Courier New', monospace; font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .case-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .case-meta b { color: var(--good); }
    .home-foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; }
    .home-foot b { color: var(--accent); }

    #detail { display: none; max-width: 1000px; margin: 0 auto; padding: 0 12px 40px; }
    .detail-top { position: sticky; top: 0; z-index: 10; background: rgba(248,250,252,.95); backdrop-filter: blur(6px); padding: 10px 2px; display: flex; align-items: center; gap: 10px; }
    .iconbtn { background: #fff; border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-size: 14px; font-weight: 600; flex-shrink: 0; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .iconbtn:hover { border-color: var(--accent); color: var(--accent); }
    .detail-title { text-align: center; font-size: 15px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .case-banner { background: linear-gradient(135deg, #0f172a, #1e3a5f); color: #fff; border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
    .case-banner .qr-card { background: #fff; border-radius: 12px; padding: 10px; flex-shrink: 0; }
    .case-banner .qr-card img { display: block; width: 180px; height: 180px; border-radius: 4px; image-rendering: pixelated; }
    .cb-info { flex: 1; min-width: 200px; }
    .cb-badge { display: inline-block; background: #0ea5e9; color: #082f49; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; margin-bottom: 8px; }
    .cb-code { font-family: 'Courier New', monospace; font-size: 16px; font-weight: 700; word-break: break-all; line-height: 1.3; }
    .cb-hint { font-size: 12px; color: #94a3b8; margin-top: 8px; }

    .section-title { font-size: 14px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin: 18px 0 10px; }
    .section-title b { color: var(--good); }
    .parts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    .part-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: center; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .part-card img { display: block; margin: 0 auto; width: 190px; height: 190px; border-radius: 4px; image-rendering: pixelated; }
    .part-label { font-family: 'Courier New', monospace; font-size: 12.5px; font-weight: 700; margin-top: 10px; word-break: break-all; }
    .part-seq { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .part-seq .num { color: var(--good); font-weight: 700; }

    @media (max-width: 520px) {
      .case-banner { flex-direction: column; text-align: center; }
      .cb-info { min-width: 0; }
      .parts-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .case-banner .qr-card img { width: 150px; height: 150px; }
      .part-card img { width: 160px; height: 160px; }
    }
  </style>

    function imgEl(text, w, h) {
      var i = document.createElement('img');
      i.src = IMGS[text] || '';
      i.width = w; i.height = h;
      i.alt = text;
      return i;
    }

    function buildHome() {
      var list = document.getElementById('caseList');
      CASES.forEach(function (c, i) {
        var card = document.createElement('div');
        card.className = 'case-card';
        card.innerHTML = '<div class="case-num">' + (i + 1) + '</div><div class="case-info"><div class="case-code" title="' + c.code + '">' + c.code + '</div><div class="case-meta"><b>' + c.parts.length + '</b> parts &middot; ' + (c.parts.length + 1) + ' QRs</div></div>';
        card.addEventListener('click', function () { openCase(i); });
        list.appendChild(card);
      });
    }

    function openCase(i) {
      var c = CASES[i];
      document.getElementById('home').style.display = 'none';
      document.getElementById('detail').style.display = 'block';
      document.getElementById('detailTitle').textContent = 'Case ' + (i + 1);
      var body = document.getElementById('detailBody');
      body.innerHTML = '';

      var banner = document.createElement('div');
      banner.className = 'case-banner';
      var qrWrap = document.createElement('div');
      qrWrap.className = 'qr-card';
      qrWrap.appendChild(imgEl(c.code, 180, 180));
      var info = document.createElement('div');
      info.className = 'cb-info';
      info.innerHTML = '<div class="cb-badge">Scan Master Case First</div><div class="cb-code">' + c.code + '</div><div class="cb-hint">Scan this code to register the case, then scan the ' + c.parts.length + ' part(s) below.</div>';
      banner.appendChild(qrWrap);
      banner.appendChild(info);
      body.appendChild(banner);

      var title = document.createElement('div');
      title.className = 'section-title';
      title.innerHTML = 'Parts to scan <b>' + c.parts.length + '</b>';
      body.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'parts-grid';
      c.parts.forEach(function (code, idx) {
        var card = document.createElement('div');
        card.className = 'part-card';
        card.appendChild(imgEl(code, 190, 190));
        var lbl = document.createElement('div');
        lbl.className = 'part-label';
        lbl.textContent = code;
        var seq = document.createElement('div');
        seq.className = 'part-seq';
        seq.innerHTML = 'Scan <span class="num">#' + (idx + 1) + '</span> of ' + c.parts.length;
        card.appendChild(lbl);
        card.appendChild(seq);
        grid.appendChild(card);
      });
      body.appendChild(grid);
      window.scrollTo(0, 0);
    }

    function goHome() {
      document.getElementById('detail').style.display = 'none';
      document.getElementById('home').style.display = 'block';
      window.scrollTo(0, 0);
    }

    document.getElementById('backBtn').addEventListener('click', goHome);
    buildHome();
    if (window.location.hash) {
      var h = parseInt(window.location.hash.replace(/^#case/, ''), 10);
      if (h >= 1 && h <= CASES.length) openCase(h - 1);
    }
  </script>
